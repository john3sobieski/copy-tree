name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release exe
        run: cargo build --release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: copytree-windows-x64
          path: target/release/copytree.exe
          if-no-files-found: error

      # The lock file is generated during the build; download it and commit it to the repo.
      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
          if-no-files-found: error

      # A tag like v0.1.0 also publishes the exe as a GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/copytree.exe
