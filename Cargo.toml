[package]
name = "copytree"
version = "0.1.2"
edition = "2021"
authors = ["john3sobieski"]
description = "Copies a folder tree to the clipboard from the Windows Explorer context menu"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
arboard = { version = "3", default-features = false }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
