[package]
name = "copytree"
version = "3.0.0"
edition = "2021"
authors = ["john3sobieski"]
description = "Copies a folder tree to the clipboard from the Windows Explorer context menu"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
arboard = { version = "3", default-features = false }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
